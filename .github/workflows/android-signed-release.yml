name: Eyad PDF Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - android/release-candidate-v0.15
    paths:
      - .github/workflows/android-signed-release.yml

permissions:
  contents: read

concurrency:
  group: eyad-pdf-signed-release
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore protected signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/eyad-pdf-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Test, lint and build signed release
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testOpensourceDebugUnitTest \
            :app:lintOpensourceRelease \
            :app:assembleOpensourceRelease

      - name: Verify signature and prepare release artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | head -n 1 | cut -d= -f2-)"
          APK="$(find app/build/outputs/apk/opensource/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p artifacts
          NAME="Eyad-PDF-Android-v${VERSION}-signed.apk"
          cp "$APK" "artifacts/$NAME"
          sha256sum "artifacts/$NAME" > "artifacts/$NAME.sha256"
          echo "name=Eyad-PDF-Android-v${VERSION}-signed" >> "$GITHUB_OUTPUT"

      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/eyad-pdf-release.jks"
