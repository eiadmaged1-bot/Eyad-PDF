name: Run v0.15 Release Candidate Patch

on:
  push:
    branches:
      - android/release-candidate-v0.15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/release-candidate-v0.15
          fetch-depth: 0

      - name: Apply consolidated council patch
        shell: pwsh
        run: python tools/apply_v015_release_candidate.py

      - name: Commit v0.15 release candidate
        shell: pwsh
        run: |
          Remove-Item tools/apply_v015_release_candidate.py -Force
          Remove-Item .github/workflows/run-v015-release-candidate.yml -Force
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Build consolidated Eyad PDF Android v0.15 release candidate'
          git push origin android/release-candidate-v0.15
