name: Squeeze Video APK
on:
  push:
    branches: [squeeze-video-v0.8-engine]
    paths:
      - '.github/workflows/squeeze-video-apk.yml'
      - 'squeeze-video/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Unpack isolated Squeeze Video project
        run: |
          cd squeeze-video
          cat chunks/{01,02,03,04,05,06,07,08}.txt | base64 -d > source.tar.xz
          echo "146b3c05b03a9f1b001078662d4435d53b7570ffa914d411cc1a588789b7627b  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
          base64 -d v021.patch.gz.b64 | gzip -d > v021.patch
          patch -p1 < v021.patch
          base64 -d v030.overlay.tar.xz.b64 > v030.overlay.tar.xz
          echo "efbb203bf72545d513c4a9b89e2e6be8f1d849874badde20086014e4e3cb93cd  v030.overlay.tar.xz" | sha256sum -c -
          tar -xJf v030.overlay.tar.xz
          sed -i 's/b.setTextAllCaps(false);/b.setAllCaps(false);/' app/src/main/java/com/squeezelab/video/StudioActivity.java
          sed -i 's/setTypeface(null, 1)/setTypeface(null, android.graphics.Typeface.BOLD)/g' app/src/main/java/com/squeezelab/video/StudioActivity.java
          sed -i '/public final class CompressionService extends Service/i @androidx.annotation.OptIn(markerClass = androidx.media3.common.util.UnstableApi.class)' app/src/main/java/com/squeezelab/video/CompressionService.java
          test -f app/src/main/res/layout-w840dp/activity_main.xml
          cat v040-part-{01,02,03,04}.pytext > v040-upgrade.py
          python3 v040-upgrade.py
          grep -q "versionName '0.4.0'" app/build.gradle
          grep -q 'Smart compression' app/src/main/res/layout/section_controls.xml
          cat v050-part-{01,02,03}.txt | base64 -d | xz -d > v050-upgrade.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("v050-upgrade.py")
          s=p.read_text()
          original="edit('StudioActivity.java','''        restore();\n        if (saved != null) {''','''        restore();\n"
          revised="edit('StudioActivity.java','''        if (saved != null) {''','''"
          if original not in s: raise SystemExit("Expected startup adjustment not found")
          p.write_text(s.replace(original,revised,1))
          PY
          python3 v050-upgrade.py
          grep -q "versionName '0.5.0'" app/build.gradle
          test -f app/src/main/java/com/squeezelab/video/StudioBranding.java
          cat v060-part-{01,02,03,04,05}.txt | base64 -d > v060.patch.xz
          echo "e86acb411d6a880a69691ba699582a7a97ec0657bf34f59d4ff521e2a877c3ba  v060.patch.xz" | sha256sum -c -
          xz -d -c v060.patch.xz | patch -p1
          grep -q "versionName '0.6.0'" app/build.gradle
          test -f app/src/main/java/com/squeezelab/video/OverlayPlacement.java
          cat v070-efficiency-part-{01,02,03}.txt | base64 -d > v070-efficiency.patch.xz
          echo "f298238fcdfe4ef7efefb90368197ae362fff8dcfd397cbd45adb94035feb4f1  v070-efficiency.patch.xz" | sha256sum -c -
          xz -dc v070-efficiency.patch.xz | patch -p1
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('app/build.gradle');s=p.read_text()
          assert "versionName '0.6.0'" in s
          s=s.replace("versionName '0.6.0'","versionName '0.7.0'")
          s=re.sub(r"versionCode\s+\d+","versionCode 8",s)
          p.write_text(s)
          PY
          grep -q "versionName '0.7.0'" app/build.gradle
          test -f app/src/main/java/com/squeezelab/video/EfficiencyPolicy.java
      - name: Recover editable v0.7 source
        run: |
          tar -czf "$RUNNER_TEMP/SqueezeVideo-v0.7.0-source.tar.gz" -C squeeze-video app build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: SqueezeVideo-v0.7-source-for-v0.8
          path: ${{ runner.temp }}/SqueezeVideo-v0.7.0-source.tar.gz
          retention-days: 5
      - name: Run tests and assemble APK
        working-directory: squeeze-video
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify APK and signing
        run: |
          APK=squeeze-video/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee squeeze-video/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SqueezeVideo-v0.7.0-debug-APK
          path: |
            squeeze-video/app/build/outputs/apk/debug/app-debug.apk
            squeeze-video/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
