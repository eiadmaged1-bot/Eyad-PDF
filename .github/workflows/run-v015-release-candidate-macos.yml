name: Run v0.15 Release Candidate Patch macOS

on:
  push:
    branches:
      - android/release-candidate-v0.15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/release-candidate-v0.15
          fetch-depth: 0

      - name: Apply consolidated council patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/apply_v015_release_candidate.py ]; then
            echo 'Patch already applied by another runner.'
            exit 0
          fi
          python3 tools/apply_v015_release_candidate.py

      - name: Commit non-workflow release changes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/apply_v015_release_candidate.py ]; then
            echo 'No patch script remains; nothing to commit.'
            exit 0
          fi
          git checkout -- .github/workflows/android-quality-gate.yml
          rm -f .github/workflows/android-signed-release.yml
          rm -f tools/apply_v015_release_candidate.py
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Build consolidated Eyad PDF Android v0.15 release candidate'
          git push origin android/release-candidate-v0.15
