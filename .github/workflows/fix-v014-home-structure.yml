name: Fix v0.14 Home Structure

on:
  push:
    branches:
      - android/ui-modernization-v0.14
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-modernization-v0.14
          fetch-depth: 0

      - name: Fix home grid structure
        run: python3 tools/fix_v014_home_brace.py

      - name: Commit verified structure
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/fix_v014_home_brace.py
          rm -f .github/workflows/fix-v014-home-structure.yml
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Fix Android v0.14 home grid structure'
          git push origin android/ui-modernization-v0.14
