name: Apply v0.14 Scroll-aware Chrome

on:
  push:
    branches:
      - android/ui-modernization-v0.14
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-modernization-v0.14
          fetch-depth: 0

      - name: Apply reviewed screen-recording changes
        run: python3 tools/apply_v014_scroll_patch.py

      - name: Commit scroll-aware chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v014_scroll_patch.py
          rm -f .github/workflows/apply-v014-scroll-aware-chrome.yml
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Make Android home chrome collapse on scroll'
          git push origin android/ui-modernization-v0.14
