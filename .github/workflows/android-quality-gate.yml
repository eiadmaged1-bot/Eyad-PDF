name: Eyad PDF Android Quality Gate

on:
  push:
    branches: [ main, 'android/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          if [ -f gradlew ] && [ -f app/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android project has not been imported yet; quality gate is waiting."
          fi

      - name: Set up JDK 17
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify fully offline manifest policy
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml app/src/*/AndroidManifest.xml 2>/dev/null; then
            echo "INTERNET permission is forbidden in Eyad PDF."
            exit 1
          fi

      - name: Build open-source offline APK
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:lintOpensourceDebug :app:assembleOpensourceDebug

      - name: Prepare named APK artifact
        if: steps.project.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Eyad-PDF-Android-v0.11.0-debug.apk
          sha256sum artifacts/Eyad-PDF-Android-v0.11.0-debug.apk > artifacts/Eyad-PDF-Android-v0.11.0-debug.apk.sha256

      - name: Upload Eyad PDF APK
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Eyad-PDF-Android-v0.11.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
