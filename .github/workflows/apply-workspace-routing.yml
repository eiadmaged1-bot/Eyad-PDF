name: Apply Eyad PDF Workspace Routing

on:
  push:
    branches: [ android/workspace-rebuild-v0.12 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route navigation to premium workspace and touch organizer
        shell: bash
        run: |
          set -euo pipefail
          FILE='app/src/main/java/com/yourname/pdftoolkit/ui/navigation/AppNavigation.kt'
          sed -i 's/^[[:space:]]*ToolsScreen(/                PremiumToolsScreen(/' "$FILE"
          sed -i 's/ReorderScreen(onNavigateBack/TouchReorderScreen(onNavigateBack/' "$FILE"

          grep -q 'PremiumToolsScreen(' "$FILE"
          grep -q 'TouchReorderScreen(onNavigateBack' "$FILE"

      - name: Commit routing once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Workspace routing is already applied.'
            exit 0
          fi
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add app/src/main/java/com/yourname/pdftoolkit/ui/navigation/AppNavigation.kt
          git commit -m 'Route Android app to premium workspace and touch organizer'
          git push origin android/workspace-rebuild-v0.12
