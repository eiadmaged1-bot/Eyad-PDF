name: Eyad PDF Android Quality Gate

on:
  push:
    branches: [ main, 'android/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyad-pdf-android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify release identity and offline policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gradle = Get-Content app/build.gradle.kts -Raw
          if ($gradle -notmatch 'applicationId\s*=\s*"com\.eyadpdf\.android"') {
            throw 'Final application ID is not com.eyadpdf.android.'
          }
          $properties = Get-Content gradle.properties
          if ($properties -notcontains 'APP_VERSION_NAME=0.15.0') {
            throw 'APP_VERSION_NAME must be 0.15.0.'
          }
          if ($properties -notcontains 'APP_VERSION_CODE=215') {
            throw 'APP_VERSION_CODE must be 215.'
          }
          $internetPermission = Get-ChildItem app/src -Recurse -Filter AndroidManifest.xml |
            Select-String -SimpleMatch 'android.permission.INTERNET'
          if ($internetPermission) {
            throw 'INTERNET permission is forbidden in the Eyad PDF offline build.'
          }

      - name: Test, lint and build open-source APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat --no-daemon `
            :app:testOpensourceDebugUnitTest `
            :app:lintOpensourceDebug `
            :app:assembleOpensourceDebug

      - name: Prepare named APK and checksum
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Get-Content gradle.properties | Where-Object { $_ -like 'APP_VERSION_NAME=*' } | Select-Object -First 1
          $version = $versionLine.Split('=', 2)[1]
          $apk = Get-ChildItem app/build/outputs/apk/opensource/debug -Recurse -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw 'No open-source debug APK was produced.' }
          New-Item artifacts -ItemType Directory -Force | Out-Null
          $name = "Eyad-PDF-Android-v$version-opensource-debug.apk"
          $target = Join-Path artifacts $name
          Copy-Item $apk.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "$target.sha256" -Encoding ascii
          "name=Eyad-PDF-Android-v$version-opensource-debug" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified Eyad PDF APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
