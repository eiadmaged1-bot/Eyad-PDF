name: Run v0.14 Transition Cleanup

on:
  push:
    branches:
      - android/ui-modernization-v0.14
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android/ui-modernization-v0.14
          fetch-depth: 0

      - name: Apply transition cleanup
        run: python3 tools/apply_v014_transition_cleanup.py

      - name: Commit transition cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v014_transition_cleanup.py
          rm -f .github/workflows/run-v014-transition-cleanup.yml
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Remove Android main-tab transition ghosting'
          git push origin android/ui-modernization-v0.14
