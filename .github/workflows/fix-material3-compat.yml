name: Fix Material3 Compatibility

on:
  push:
    branches: [ android/workspace-rebuild-v0.12 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compatibility fixes for current Compose BOM
        shell: bash
        run: |
          set -euo pipefail
          PREMIUM='app/src/main/java/com/yourname/pdftoolkit/ui/screens/PremiumToolsScreen.kt'
          TOUCH='app/src/main/java/com/yourname/pdftoolkit/ui/screens/TouchReorderScreen.kt'

          sed -i '/import androidx.compose.material3.HorizontalDivider/d' "$PREMIUM"
          sed -i '/import androidx.compose.material3.VerticalDivider/d' "$PREMIUM"
          sed -i '/^[[:space:]]*VerticalDivider()$/d' "$PREMIUM"

          sed -i 's/surfaceContainerLowest/surface/g' "$PREMIUM" "$TOUCH"
          sed -i 's/surfaceContainerLow/surfaceVariant/g' "$PREMIUM" "$TOUCH"

          if grep -RIn 'surfaceContainerLow\|surfaceContainerLowest\|HorizontalDivider\|VerticalDivider' "$PREMIUM" "$TOUCH"; then
            echo 'Unsupported Material3 API remains.'
            exit 1
          fi

      - name: Commit compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Compatibility fixes already applied.'
            exit 0
          fi
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add app/src/main/java/com/yourname/pdftoolkit/ui/screens/PremiumToolsScreen.kt \
                  app/src/main/java/com/yourname/pdftoolkit/ui/screens/TouchReorderScreen.kt
          git commit -m 'Fix Compose Material3 compatibility for workspace rebuild'
          git push origin android/workspace-rebuild-v0.12
