name: Apply v0.13 Drag Polish

on:
  push:
    branches: [ android/ui-modernization-v0.13 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smooth edge auto-scroll and enlarge organizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/yourname/pdftoolkit/ui/screens/TouchReorderScreen.kt')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\nimport kotlin.math.roundToInt',
              'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.launch\nimport kotlinx.coroutines.withContext\nimport kotlin.math.abs\nimport kotlin.math.roundToInt',
          )

          text = text.replace(
              '    var dropInsertion by remember { mutableStateOf<Int?>(null) }\n    var autoScrollJob by remember { mutableStateOf<Job?>(null) }',
              '    var dropInsertion by remember { mutableStateOf<Int?>(null) }\n    var autoScrollJob by remember { mutableStateOf<Job?>(null) }\n    var autoScrollVelocity by remember { mutableStateOf(0f) }',
          )

          old_reset = '''        dropInsertion = null
        autoScrollJob?.cancel()
        autoScrollJob = null
    }
'''
          new_reset = '''        dropInsertion = null
        autoScrollVelocity = 0f
        autoScrollJob?.cancel()
        autoScrollJob = null
    }

    fun resolveDropInsertion() {
        val layoutInfo = gridState.layoutInfo
        val target = layoutInfo.visibleItemsInfo.firstOrNull { info ->
            pointerInViewport.x >= info.offset.x &&
                pointerInViewport.x <= info.offset.x + info.size.width &&
                pointerInViewport.y >= info.offset.y &&
                pointerInViewport.y <= info.offset.y + info.size.height
        }

        if (target != null) {
            val after = pointerInViewport.y > target.offset.y + target.size.height / 2f
            dropInsertion = (target.index + if (after) 1 else 0).coerceIn(0, pages.size)
            return
        }

        val visible = layoutInfo.visibleItemsInfo
        if (visible.isEmpty()) return
        dropInsertion = when {
            pointerInViewport.y <= layoutInfo.viewportStartOffset -> visible.first().index
            pointerInViewport.y >= layoutInfo.viewportEndOffset -> visible.last().index + 1
            else -> dropInsertion
        }?.coerceIn(0, pages.size)
    }

    fun ensureAutoScroll() {
        if (abs(autoScrollVelocity) < 0.1f || draggedPageNumber == null) {
            autoScrollJob?.cancel()
            autoScrollJob = null
            return
        }
        if (autoScrollJob?.isActive == true) return

        autoScrollJob = scope.launch {
            while (isActive && draggedPageNumber != null && abs(autoScrollVelocity) >= 0.1f) {
                val consumed = gridState.scrollBy(autoScrollVelocity)
                resolveDropInsertion()
                if (abs(consumed) < 0.1f) {
                    autoScrollVelocity = 0f
                    break
                }
                delay(16L)
            }
            autoScrollJob = null
        }
    }
'''
          if old_reset not in text:
              raise SystemExit('resetDrag anchor not found')
          text = text.replace(old_reset, new_reset, 1)

          old_drag = '''                                            val target = gridState.layoutInfo.visibleItemsInfo.firstOrNull { info ->
                                                pointerInViewport.x >= info.offset.x &&
                                                    pointerInViewport.x <= info.offset.x + info.size.width &&
                                                    pointerInViewport.y >= info.offset.y &&
                                                    pointerInViewport.y <= info.offset.y + info.size.height
                                            }
                                            if (target != null) {
                                                val after = pointerInViewport.y >
                                                    target.offset.y + target.size.height / 2f
                                                dropInsertion = (target.index + if (after) 1 else 0)
                                                    .coerceIn(0, pages.size)
                                            }

                                            val thresholdPx = with(density) { 88.dp.toPx() }
                                            val scrollAmount = when {
                                                pointerInViewport.y <
                                                    gridState.layoutInfo.viewportStartOffset + thresholdPx -> -42f
                                                pointerInViewport.y >
                                                    gridState.layoutInfo.viewportEndOffset - thresholdPx -> 42f
                                                else -> 0f
                                            }
                                            if (
                                                scrollAmount != 0f &&
                                                (autoScrollJob == null || autoScrollJob?.isCompleted == true)
                                            ) {
                                                autoScrollJob = scope.launch {
                                                    gridState.scrollBy(scrollAmount)
                                                }
                                            }
'''
          new_drag = '''                                            resolveDropInsertion()

                                            val layoutInfo = gridState.layoutInfo
                                            val thresholdPx = with(density) { 64.dp.toPx() }
                                            val viewportStart = layoutInfo.viewportStartOffset.toFloat()
                                            val viewportEnd = layoutInfo.viewportEndOffset.toFloat()
                                            val y = pointerInViewport.y
                                            val maxVelocity = 9f
                                            autoScrollVelocity = when {
                                                y < viewportStart + thresholdPx -> {
                                                    val depth = ((viewportStart + thresholdPx - y) / thresholdPx)
                                                        .coerceIn(0f, 1f)
                                                    -(2.5f + (maxVelocity - 2.5f) * depth)
                                                }
                                                y > viewportEnd - thresholdPx -> {
                                                    val depth = ((y - (viewportEnd - thresholdPx)) / thresholdPx)
                                                        .coerceIn(0f, 1f)
                                                    2.5f + (maxVelocity - 2.5f) * depth
                                                }
                                                else -> 0f
                                            }
                                            ensureAutoScroll()
'''
          if old_drag not in text:
              raise SystemExit('drag auto-scroll anchor not found')
          text = text.replace(old_drag, new_drag, 1)

          text = text.replace('columns = GridCells.Adaptive(150.dp)', 'columns = GridCells.Adaptive(168.dp)', 1)
          text = text.replace('shape = RoundedCornerShape(20.dp),\n                    color = MaterialTheme.colorScheme.surfaceVariant,', 'shape = RoundedCornerShape(24.dp),\n                    color = MaterialTheme.colorScheme.surfaceVariant,', 1)
          text = text.replace('modifier = Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 12.dp)', 'modifier = Modifier.fillMaxSize().padding(horizontal = 18.dp, vertical = 14.dp)', 1)
          text = text.replace('modifier = Modifier.size(42.dp)', 'modifier = Modifier.size(48.dp)', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time migration and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v013-drag-polish.yml
          git config user.name 'Eyad PDF Build Bot'
          git config user.email 'eiadmaged1@gmail.com'
          git add -A
          git commit -m 'Polish organizer edge dragging for v0.13'
          git push origin android/ui-modernization-v0.13
