name: Squeeze Video APK
on:
  push:
    branches: [squeeze-video-apk-v0.2]
    paths:
      - '.github/workflows/squeeze-video-apk.yml'
      - 'squeeze-video/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false
      - name: Install Android SDK
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Unpack isolated Squeeze Video project
        run: |
          cd squeeze-video
          cat chunks/{01,02,03,04,05,06,07,08}.txt | base64 -d > source.tar.xz
          echo "146b3c05b03a9f1b001078662d4435d53b7570ffa914d411cc1a588789b7627b  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
      - name: Run tests and assemble APK
        working-directory: squeeze-video
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK and signing
        run: |
          APK=squeeze-video/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee squeeze-video/APK_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SqueezeVideo-v0.2.0-debug-APK
          path: |
            squeeze-video/app/build/outputs/apk/debug/app-debug.apk
            squeeze-video/APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
